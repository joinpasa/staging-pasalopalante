<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pásalo Pa'lante</title>
    <meta name="description" content="Pásalo Pa'lante — log acts of kindness, view your streak and badges, and share your pass with the movement." />
    <meta name="author" content="Te Amo PR" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8G8FLD1YFC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-8G8FLD1YFC');
    </script>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FAF7F2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pásalo" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" />

    <style>
      /* Critical inline CSS: brand-correct first paint, no unstyled flash. */
      html, body {
        margin: 0;
        background-color: #FAF7F2; /* brand warm off-white */
        color: #0E234B; /* brand navy */
        font-family: "Montserrat", ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #ppl-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #FAF7F2;
        transition: opacity 260ms ease, visibility 260ms ease;
      }
      #ppl-splash-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        opacity: 0;
        animation: ppl-splash-in 600ms ease 80ms forwards;
      }
      #ppl-splash-lockup img {
        height: auto;
      }
      #ppl-splash-pkf {
        width: 60px;
      }
      #ppl-splash-x {
        font-size: 15px;
        font-weight: 300;
        line-height: 1;
        color: #0E234B;
        opacity: 0.3;
      }
      #ppl-splash-lockup img:last-child {
        width: 132px;
      }
      @keyframes ppl-splash-in {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      html.app-ready #ppl-splash {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #ppl-splash, #ppl-splash-lockup { transition: none; animation: none; opacity: 1; }
      }
    </style>
  </head>

  <body>
    <div id="ppl-splash" aria-hidden="true">
      <div id="ppl-splash-lockup">
        <img id="ppl-splash-pkf" src="/logo-PKF-icon.png" srcset="/logo-PKF-icon.png 1x, /logo-PKF-icon@2x.png 2x" alt="" width="60" height="60" />
        <span id="ppl-splash-x">×</span>
        <img src="/logo-PPL.png" alt="" width="132" height="132" />
      </div>
    </div>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
