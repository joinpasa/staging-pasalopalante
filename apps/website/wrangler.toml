name = "stagingsite-pasalopalante"
compatibility_date = "2024-09-23"

# Pure static-asset deployment — no Worker script. This is the modern
# Workers equivalent of classic Cloudflare Pages: `wrangler deploy` serves
# everything in `directory` as static files instead of running a function.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
