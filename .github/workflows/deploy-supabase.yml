name: Deploy Supabase

# Cloudflare already auto-deploys apps/website and apps/app on every push.
# This is the same thing for the backend half: database migrations and
# edge functions, which previously only went live if someone ran the
# Supabase CLI by hand from their own terminal. Now a push to the tracked
# branch that touches supabase/** ships both automatically, same as the
# frontend — no terminal required for either half anymore.

on:
  push:
    branches:
      - claude/app-website-separation-lgg5nb
    paths:
      - "supabase/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: tipfbleltjexofsjffwb
      # Optional. The Kindness Hub's HighLevel key; see the step that uses it.
      HUB_GHL_TOKEN: ${{ secrets.HUB_GHL_TOKEN }}
      # Optional. The key that turns on the Kindness Hub's API (hub-api); see the last step.
      HUB_API_KEY: ${{ secrets.HUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Pinned: "latest" picked up CLI 3.0.0 on 2026-11-04, which changed
      # `db push` to target a local Docker database by default and failed
      # every deploy. Bump this deliberately and check the release notes.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Link Supabase project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push database migrations
        # --remote: CLI 3 targets the local stack unless told otherwise; this
        # is the linked project from the step above.
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy edge functions
        # --use-api bundles server-side instead of pulling the edge-runtime
        # Docker image locally — that pull was hitting ghcr.io's anonymous
        # rate limit intermittently and failing this step even when nothing
        # about the functions themselves had changed.
        # --yes: CLI 3 asks to confirm deploys to the hosted project and
        # fails in CI (no terminal) without it.
        run: supabase functions deploy --use-api --yes

      - name: Pass the Kindness Hub's HighLevel key to its function
        # The hub's key is kept as a GitHub secret (HUB_GHL_TOKEN) so that adding or replacing
        # it needs no Supabase dashboard access: this copies it to the edge functions' own
        # secrets on every deploy. Skipped until the GitHub secret exists.
        if: ${{ env.HUB_GHL_TOKEN != '' }}
        run: supabase secrets set HUB_GHL_TOKEN="$HUB_GHL_TOKEN" --project-ref "$PROJECT_REF"

      - name: Pass the Kindness Hub's API key to its function
        # Same idea for hub-api: the key lives as the GitHub secret HUB_API_KEY, and the API stays
        # switched off (it answers every request with "switched off") until that secret exists.
        if: ${{ env.HUB_API_KEY != '' }}
        run: supabase secrets set HUB_API_KEY="$HUB_API_KEY" --project-ref "$PROJECT_REF"
